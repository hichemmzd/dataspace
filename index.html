<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who Are You in Money Heist? — DATA SPACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Oswald:wght@700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Special+Elite&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️‍♂️</text></svg>">

  <style>
    :root {
      --bg-primary: #070709;
      --bg-card: rgba(18, 19, 26, 0.94);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #e11d48;
      --accent-glow: rgba(225, 29, 72, 0.45);
      --gold-accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body.lang-ar {
      font-family: 'Cairo', sans-serif;
      direction: rtl;
    }

    .bg-ambient {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
    }

    .quiz-container {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      background: rgba(225, 29, 72, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 1.2rem;
    }

    /* LANGUAGE SELECTOR SCREEN */
    .lang-screen {
      text-align: center;
      padding: 1rem 0;
    }

    .lang-screen h2 {
      font-size: 1.7rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .lang-screen p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .lang-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .lang-card-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 1.6rem 1rem;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-card-btn:hover {
      border-color: var(--accent);
      background: rgba(225, 29, 72, 0.12);
      transform: translateY(-4px);
    }

    .lang-flag {
      font-size: 2.2rem;
    }

    .lang-name {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .lang-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* QUESTION SCREEN */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .quiz-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .quiz-progress {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--gold-accent);
      font-weight: 800;
    }

    .quiz-question-text {
      font-size: 1.18rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.55;
      color: #f8fafc;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .quiz-opt-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: inherit;
      line-height: 1.45;
    }

    body.lang-ar .quiz-opt-btn {
      text-align: right;
    }

    .quiz-opt-btn:hover {
      border-color: var(--accent);
      background: rgba(225, 29, 72, 0.12);
      transform: translateX(6px);
    }

    body.lang-ar .quiz-opt-btn:hover {
      transform: translateX(-6px);
    }

    .opt-letter {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: var(--gold-accent);
      background: rgba(0, 0, 0, 0.5);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    /* RESULT DOSSIER CARD */
    .result-card-wrap {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .dossier-card {
      background: #cbb493;
      background-image: 
        radial-gradient(ellipse at center, rgba(235, 218, 194, 0.95) 0%, rgba(186, 156, 120, 0.95) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0px, rgba(0,0,0,0.035) 1px, transparent 1px, transparent 3px);
      color: #171310;
      border: 1.5mm solid #6d5438;
      border-radius: 8px;
      padding: 2.2rem 1.8rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      position: relative;
      margin-bottom: 1.4rem;
    }

    .dossier-stamp {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: 'Special Elite', monospace;
      font-size: 0.85rem;
      color: #991b1b;
      border: 2px dashed #991b1b;
      padding: 3px 8px;
      transform: rotate(5deg);
      font-weight: 700;
    }

    body.lang-ar .dossier-stamp {
      right: auto;
      left: 18px;
      transform: rotate(-5deg);
    }

    .dossier-avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid #171310;
      object-fit: cover;
      margin: 0 auto 0.9rem;
      display: block;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .dossier-character-title {
      font-family: 'Oswald', 'Cairo', sans-serif;
      font-size: 1.85rem;
      text-transform: uppercase;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .dossier-cell-tag {
      font-family: 'Special Elite', 'Cairo', monospace;
      font-size: 0.95rem;
      font-weight: bold;
      color: #7f1d1d;
      margin-bottom: 1rem;
      display: block;
    }

    .dossier-quote {
      font-family: 'Playfair Display', 'Cairo', serif;
      font-style: italic;
      font-size: 0.98rem;
      line-height: 1.55;
      padding: 0 0.5rem;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .btn-return {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: inherit;
    }

    .btn-return:hover {
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-restart {
      background: transparent;
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'JetBrains Mono', 'Cairo', monospace;
      font-size: 0.8rem;
    }

    .btn-restart:hover {
      color: #fff;
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div class="bg-ambient"></div>

  <div class="quiz-container">
    <div class="top-badge" id="ui-top-badge">DATA HEIST // CLASSIFIED INTEL</div>

    <!-- 1. LANGUAGE SELECTION SCREEN -->
    <div class="lang-screen" id="quiz-lang-screen">
      <h2>SELECT PROTOCOL LANGUAGE</h2>
      <p>اختر لغة العملية التكتيكية للمتابعة</p>

      <div class="lang-options-grid">
        <button class="lang-card-btn" onclick="setLanguage('en')">
          <span class="lang-flag">🇬🇧</span>
          <span class="lang-name">English</span>
          <span class="lang-sub">Standard Protocol</span>
        </button>

        <button class="lang-card-btn" onclick="setLanguage('ar')">
          <span class="lang-flag">🇩🇿</span>
          <span class="lang-name">العربية</span>
          <span class="lang-sub">البروتوكول المعرب</span>
        </button>
      </div>
    </div>

    <!-- 2. ACTIVE QUESTION SCREEN -->
    <div id="quiz-active-screen" style="display: none;">
      <div class="quiz-header">
        <span class="quiz-title" id="ui-quiz-title">TACTICAL PERSONA TEST</span>
        <span class="quiz-progress" id="quiz-progress-text">QUESTION 1 / 4</span>
      </div>

      <div class="quiz-question-text" id="quiz-question-text">Loading...</div>
      <div class="quiz-options" id="quiz-options-container"></div>
    </div>

    <!-- 3. RESULT DOSSIER SCREEN -->
    <div class="result-card-wrap" id="quiz-result-screen">
      <div class="dossier-card">
        <div class="dossier-stamp" id="ui-stamp">VERIFIED OPERATIVE</div>
        <img src="profissor.jpg" alt="Persona Avatar" class="dossier-avatar" id="result-avatar">
        <h3 class="dossier-character-title" id="result-name">THE PROFESSOR</h3>
        <span class="dossier-cell-tag" id="result-role">ASSIGNED TO: CELL 01 // IT COMMAND</span>
        <p class="dossier-quote" id="result-desc">Loading persona...</p>
      </div>

      <div class="action-buttons">
        <a href="index.html" class="btn-return" id="btn-return-link">
          <span id="ui-btn-return-text">Explore Main Syndicate</span>
          <span>&rarr;</span>
        </a>
        <button class="btn-restart" onclick="restartQuiz()" id="ui-btn-restart">
          ↺ Retake Test
        </button>
      </div>
    </div>
  </div>

  <script>
    let selectedLang = 'en';

    const translations = {
      en: {
        topBadge: "DATA HEIST // CLASSIFIED INTEL",
        quizTitle: "TACTICAL PERSONA TEST",
        questionLabel: "QUESTION",
        stamp: "VERIFIED OPERATIVE",
        btnReturn: "Explore Main Syndicate",
        btnRestart: "↺ Retake Test",
        letters: ['A', 'B', 'C', 'D'],
        questions: [
          {
            question: "1. An unexpected crisis hits the operational perimeter. What is your immediate instinct?",
            options: [
              { text: "Isolate the variables, analyze log patterns, and recode the algorithm.", cell: "IT" },
              { text: "Take the radio, command the room, and negotiate an advantageous settlement.", cell: "RE" },
              { text: "Rally the crew, enforce execution discipline, and keep the deadline moving.", cell: "RH" },
              { text: "Broadcast the truth to the public, ignite sympathy, and own the narrative.", cell: "COM" }
            ]
          },
          {
            question: "2. In a high-stakes mission room, which tactical weapon best suits your skillset?",
            options: [
              { text: "A secured terminal with Python notebooks, neural pipelines, and predictive models.", cell: "IT" },
              { text: "A clean dossier of corporate agreements, sponsorship pacts, and diplomatic handshakes.", cell: "RE" },
              { text: "An airtight operational roadmap, performance tracking, and resource allocation.", cell: "RH" },
              { text: "A high-definition camera, cinematic storytelling, and a viral media broadcast channel.", cell: "COM" }
            ]
          },
          {
            question: "3. What motivates you most when joining a scientific club syndicate?",
            options: [
              { text: "Decoding artificial intelligence, algorithmic problem solving, and complex architectures.", cell: "IT" },
              { text: "Expanding strategic networks, sealing external partnerships, and commanding diplomacy.", cell: "RE" },
              { text: "Coordinating team operations, discovering student talent, and optimizing internal workflows.", cell: "RH" },
              { text: "Creating powerful visual brand identities and crafting unforgettable public campaigns.", cell: "COM" }
            ]
          },
          {
            question: "4. When the operation succeeds, how do you measure victory?",
            options: [
              { text: "The automated predictive systems ran seamlessly with zero algorithmic latency.", cell: "IT" },
              { text: "Strategic sponsorships and elite university alliances were fully secured.", cell: "RE" },
              { text: "Every operative executed their role on time with peak tactical coordination.", cell: "RH" },
              { text: "The campus and digital networks are buzzing with our movement's impact.", cell: "COM" }
            ]
          }
        ],
        personas: {
          IT: {
            name: "THE PROFESSOR // RIO",
            role: "ASSIGNED TO: CELL 01 // IT COMMAND",
            avatar: "profissor.jpg",
            desc: "\"Your mind rejects randomness. You design architectures and anticipate scenarios long before the first byte executes. Your domain is predictive modeling and deep intelligence.\""
          },
          RE: {
            name: "BERLIN",
            role: "ASSIGNED TO: CELL 02 // EXTERNAL RELATIONS",
            avatar: "mask.PNG",
            desc: "\"Charisma, precision, and commanding presence. You turn negotiations into art and secure the vital corridors that keep the syndicate supplied and respected.\""
          },
          RH: {
            name: "NAIROBI",
            role: "ASSIGNED TO: CELL 03 // HUMAN RESOURCES",
            avatar: "nairobi.jfif",
            desc: "\"The engine of execution and discipline. You transform raw potential into elite operatives and guarantee that every deadline is met without flaw.\""
          },
          COM: {
            name: "TOKYO",
            role: "ASSIGNED TO: CELL 04 // COMMUNICATION & MEDIA",
            avatar: "tokyo.jfif",
            desc: "\"Fearless, vivid, and unmistakable. You are the voice and visual identity of the resistance, ensuring our story reverberates across every screen and corridor.\""
          }
        }
      },
      ar: {
        topBadge: "سرقة البيانات // ملف سري للغاية",
        quizTitle: "اختبار الشخصية التكتيكية",
        questionLabel: "السؤال",
        stamp: "عنصر مؤهل رسمياً",
        btnReturn: "الرجوع للجناح الرئيسي للنادي",
        btnRestart: "↺ إعادة الاختبار من جديد",
        letters: ['أ', 'ب', 'ج', 'د'],
        questions: [
          {
            question: "1. طرأت أزمة مفاجئة وغير متوقعة أثناء سير الخطة، ما هي ردة فعلك الأولى؟",
            options: [
              { text: "أعزل المتغيرات، أحلل سجلات الأخطاء، وأعيد كتابة الخوارزمية فوراً.", cell: "IT" },
              { text: "أمسك جهاز اللاسلكي، أسيطر على الموقف، وأبدأ مفاوضة الطرف المقابل بذكاء.", cell: "RE" },
              { text: "أجمع أفراد الفريق، أفرض الانضباط والهدوء، وأضمن استمرار العمل بدون توقف.", cell: "RH" },
              { text: "أنقل ما حدث للجمهور والإعلام بأسلوب ذكي لكسب التعاطف والسيطرة على الرأي العام.", cell: "COM" }
            ]
          },
          {
            question: "2. داخل غرفة التخطيط والعمليات الكبرى، ما هو السلاح الأنسب لمهاراتك؟",
            options: [
              { text: "حاسوب محمي يحتوي على أكواد Python، ونماذج تنبؤية وخوارزميات ذكاء اصطناعي.", cell: "IT" },
              { text: "ملف اتفاقيات احترافي، ورعايات رسمية، وعلاقات دبلوماسية مع مختلف الشركاء.", cell: "RE" },
              { text: "خارطة طريق محكمة، وجدول زمني دقيق، ونظام لتوزيع وإدارة طاقات الأعضاء.", cell: "RH" },
              { text: "كاميرا سينمائية، ورؤية إبداعية لنشر الفيديوهات وصناعة الهوية البصرية الجذابة.", cell: "COM" }
            ]
          },
          {
            question: "3. ما هو أكثر شيء يحفزك عند الانضمام لنادٍ علمي طلابي؟",
            options: [
              { text: "تفكيك نماذج الذكاء الاصطناعي، وحل المسائل البرمجية، وفهم هندسة البيانات.", cell: "IT" },
              { text: "توسيع شبكة معارفي، وبناء شراكات مع أندية وشركات كبرى، وإتقان فن الإقناع.", cell: "RE" },
              { text: "تنسيق فرق العمل، واكتشاف مواهب الطلبة الجدد، وتنظيم الورشات والفعاليات.", cell: "RH" },
              { text: "إخراج أفكار إعلامية مبهرة، وإدارة منصات التواصل، وإيصال صوت النادي للجميع.", cell: "COM" }
            ]
          },
          {
            question: "4. عندما تنجح الفعالية أو العملية، كيف تقيس نجاحك الشخصي؟",
            options: [
              { text: "الأنظمة الذكية والحلول التقنية اشتغلت بدقة كاملة وبدون أي أخطاء برمجية.", cell: "IT" },
              { text: "حصلنا على صفقات ورعايات قوية وثابتة عززت من مكانة واسم الفريق بالخارج.", cell: "RE" },
              { text: "كل عضو في الفريق نفذ مهامه في الوقت المحدد بروح جماعية وانضباط تام.", cell: "RH" },
              { text: "الكل في الكلية والإنترنت يتحدث عن روعة الحدث وعن المحتوى والتغطية التي قدمناها.", cell: "COM" }
            ]
          }
        ],
        personas: {
          IT: {
            name: "البروفيسور // ريو",
            role: "التوجيه: الخلية 01 // مصلحة التكنولوجيا والأنظمة (IT)",
            avatar: "profissor.jpg",
            desc: "\"عقلك لا يقبل العشوائية؛ أنت تبني المعمارية وتتوقع السيناريوهات قبل تنفيذ أول سطر برمجي. مجالك هو النمذجة التنبؤية وأنظمة الذكاء الاصطناعي.\""
          },
          RE: {
            name: "برلين",
            role: "التوجيه: الخلية 02 // مصلحة العلاقات الخارجية (RE)",
            avatar: "mask.PNG",
            desc: "\"حضور قوي، كاريزما ودبلوماسية حادة. أنت تحول المفاوضات إلى فن، وتفتح المسارات الحيوية التي تضمن الدعم والرعايات لعمليات الفريق.\""
          },
          RH: {
            name: "نيروبي",
            role: "التوجيه: الخلية 03 // مصلحة الموارد البشرية والجودة (RH)",
            avatar: "nairobi.jfif",
            desc: "\"محرك الانضباط والتنفيذ المتقن. أنت من يحول الطاقات الطلابية إلى عناصر بارعة، وتضمن تسليم كل مشروع في موعده بدون أي خلل.\""
          },
          COM: {
            name: "طوكيو",
            role: "التوجيه: الخلية 04 // مصلحة الإعلام والاتصال (COM)",
            avatar: "tokyo.jfif",
            desc: "\"شجاعة، صاحبة صوت جريء ولمسة بصرية لا تُنسى. أنت واجهة المقاومة وهويتها، وتجعل قصة وأعمال النادي تتردد في كل شاشة ورواق.\""
          }
        }
      }
    };

    let currentQuestionIndex = 0;
    let scores = { IT: 0, RE: 0, RH: 0, COM: 0 };

    function setLanguage(lang) {
      selectedLang = lang;
      const dict = translations[lang];

      if (lang === 'ar') {
        document.body.classList.add('lang-ar');
      } else {
        document.body.classList.remove('lang-ar');
      }

      document.getElementById('ui-top-badge').innerText = dict.topBadge;
      document.getElementById('ui-quiz-title').innerText = dict.quizTitle;
      document.getElementById('ui-stamp').innerText = dict.stamp;
      document.getElementById('ui-btn-return-text').innerText = dict.btnReturn;
      document.getElementById('ui-btn-restart').innerText = dict.btnRestart;

      document.getElementById('quiz-lang-screen').style.display = 'none';
      document.getElementById('quiz-active-screen').style.display = 'block';

      currentQuestionIndex = 0;
      scores = { IT: 0, RE: 0, RH: 0, COM: 0 };
      loadQuestion();
    }

    function loadQuestion() {
      const dict = translations[selectedLang];
      const q = dict.questions[currentQuestionIndex];
      
      document.getElementById('quiz-progress-text').innerText = `${dict.questionLabel} ${currentQuestionIndex + 1} / ${dict.questions.length}`;
      document.getElementById('quiz-question-text').innerText = q.question;
      
      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.innerHTML = `<span class="opt-letter">${dict.letters[idx]}</span> <span>${opt.text}</span>`;
        btn.onclick = () => selectOption(opt.cell);
        container.appendChild(btn);
      });
    }

    function selectOption(cell) {
      scores[cell]++;
      currentQuestionIndex++;
      const dict = translations[selectedLang];

      if (currentQuestionIndex < dict.questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-active-screen').style.display = 'none';
      document.getElementById('quiz-result-screen').style.display = 'block';

      const assignedCell = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
      const persona = translations[selectedLang].personas[assignedCell];

      document.getElementById('result-name').innerText = persona.name;
      document.getElementById('result-role').innerText = persona.role;
      document.getElementById('result-desc').innerText = persona.desc;
      
      const imgElem = document.getElementById('result-avatar');
      imgElem.src = persona.avatar;
      imgElem.onerror = () => { imgElem.src = 'mask.PNG'; };
    }

    function restartQuiz() {
      document.getElementById('quiz-result-screen').style.display = 'none';
      document.getElementById('quiz-active-screen').style.display = 'none';
      document.getElementById('quiz-lang-screen').style.display = 'block';
      document.body.classList.remove('lang-ar');
    }
  </script>
</body>
</html>
